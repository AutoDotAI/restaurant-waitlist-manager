[project]
name = "restaurant-waitlist-manager-backend"
version = "0.1.0"
description = "FastAPI backend for the restaurant waitlist manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
